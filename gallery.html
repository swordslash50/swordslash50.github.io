<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <meta name="description" content="Jackson Smith Photography Gallery" />
    <meta name="author" content="Jackson Smith" />

    <title>Photo Gallery | JacksonBSPhoto</title>

    <!-- Icon -->
    <link rel="icon" type="image/x-icon" href="static/assets/favicon.ico" />

    <!-- Bootstrap icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css"
        rel="stylesheet" />

    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com" />

    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,600;1,600&display=swap"
        rel="stylesheet" />

    <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,300;0,500;0,600;0,700;1,300;1,500;1,600;1,700&display=swap"
        rel="stylesheet" />

    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,400;1,400&display=swap"
        rel="stylesheet" />

    <!-- Same CSS as homepage -->
    <link type="text/css" href="static/css/main.css" rel="stylesheet" />

    <!-- Bootstrap -->
    <script type="text/javascript" src="static/js/bootstrap.bundle.min.js"></script>

    <!-- Theme-->
     <script type="text/javascript" src="static/js/theme.js"></script>


    <style>
    .gallery-header-text {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100%;
    text-align: center;
    }
    
    </style>

</head>

<body id="page-top">

    <!-- Navigation -->
    <nav class="header navbar navbar-expand-lg navbar-light fixed-top shadow-sm" id="mainNav">
        <div class="container px-5">

            <a class="navbar-brand fw-bold" href="index.html">
                JacksonBSPhoto
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarResponsive"
                    aria-controls="navbarResponsive"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                MENU
                <i class="bi-list"></i>
            </button>

            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav ms-auto me-4 my-3 my-lg-0">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            HOME
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="index.html#photos">
                            PHOTOS
                        </a>
                    </li>
                    <button
                        id="theme-toggle"
                        class="theme-toggle"
                        type="button"
                        aria-label="Toggle dark mode"
                        title="Toggle dark mode">
                        <i class="bi bi-moon-fill"></i>
                    </button>

                </ul>
            </div>
        </div>
    </nav>


    <!-- Gallery header -->
    <section class="top-section">

        <div class="top-section-bg top-section-bg-active"
             style="background-image: url('static/assets/background/background_0.jpeg');">
        </div>

        <div class="top-section-content gallery-header-text">
    <div class="container px-5">
        <h2 class="text-white display-3 lh-1 font-alt">
            Photo Gallery
        </h2>
    </div>
</div>

    </section>


    <!-- Gallery -->
    <main>

        <section class="bg-light py-5">

            <div class="container px-5">

                <div class="text-center mb-5">

                    <h2 class="display-5">
                        Here Are Some Photos I've Taken
                    </h2>


                </div>


                <div class="row g-4">


                    <!-- Photo 1 -->
                    <div class="col-6 col-md-4 col-lg-3">

                        <a href="#"
                           data-bs-toggle="modal"
                           data-bs-target="#photoModal"
                           data-photo="static/assets/img/gallery/photo1.jpg">

                            <img
                                src="static/assets/img/gallery/photo1.jpg"
                                class="img-fluid rounded shadow-sm gallery-image"
                                alt="Photo 1">

                        </a>

                    </div>


                    <!-- Photo 2 -->
                    <div class="col-6 col-md-4 col-lg-3">

                        <a href="#"
                           data-bs-toggle="modal"
                           data-bs-target="#photoModal"
                           data-photo="static/assets/img/gallery/photo2.jpg">

                            <img
                                src="static/assets/img/gallery/photo2.jpg"
                                class="img-fluid rounded shadow-sm gallery-image"
                                alt="Photo 2">

                        </a>

                    </div>


                    <!-- Photo 3 -->
                    <div class="col-6 col-md-4 col-lg-3">

                        <a href="#"
                           data-bs-toggle="modal"
                           data-bs-target="#photoModal"
                           data-photo="static/assets/img/gallery/photo3.jpg">

                            <img
                                src="static/assets/img/gallery/photo3.jpg"
                                class="img-fluid rounded shadow-sm gallery-image"
                                alt="Photo 3">

                        </a>

                    </div>


                    <!-- Photo 4 -->
                    <div class="col-6 col-md-4 col-lg-3">

                        <a href="#"
                           data-bs-toggle="modal"
                           data-bs-target="#photoModal"
                           data-photo="static/assets/img/gallery/photo4.jpg">

                            <img
                                src="static/assets/img/gallery/photo4.jpg"
                                class="img-fluid rounded shadow-sm gallery-image"
                                alt="Photo 4">

                        </a>

                    </div>


                </div>

            </div>

        </section>

    </main>


    <!-- Image Lightbox -->
    <div class="modal fade"
         id="photoModal"
         tabindex="-1"
         aria-hidden="true">

        <div class="modal-dialog modal-xl modal-dialog-centered">

            <div class="modal-content bg-dark">

                <div class="modal-header border-0">

                    <button type="button"
                            class="btn-close btn-close-white"
                            data-bs-dismiss="modal"
                            aria-label="Close">
                    </button>

                </div>

                <div class="modal-body text-center">

                    <img id="modalImage"
                         src=""
                         class="img-fluid"
                         alt="">

                </div>

            </div>

        </div>

    </div>


    <!-- Footer -->
    <footer class="bg-bottom text-center py-5">

        <div class="container px-5">

            <div class="text-white-50 small">

                <div class="mb-2">
                    &copy; Jackson Smith 2026. All Rights Reserved.
                </div>

                <a href="https://github.com/swordslash50">
                    Github
                </a>

                <span class="mx-1">&middot;</span>

                <a href="https://github.com/swordslash50/swordslash50.github.io/blob/main/LICENSE">
                    License
                </a>

            </div>

        </div>

    </footer>


    <!-- Lightbox JavaScript -->
    <script>

        const photoModal = document.getElementById('photoModal');

        photoModal.addEventListener('show.bs.modal', function (event) {

            const link = event.relatedTarget;

            const image = link.getAttribute('data-photo');

            const modalImage =
                document.getElementById('modalImage');

            modalImage.src = image;

        });

    </script>

</body>

</html>
